[package]
name = "question-desk"
version = "0.1.0"
edition = "2024"
default-run = "question-desk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4"
axum = "0.8"
directories = "6.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
pulldown-cmark = "0.13.6"
pulldown-cmark-to-cmark = "23.0.1"
rmcp = { version = "3.9", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
# `custom-protocol` serves the embedded `ui/` folder, so a plain `cargo build` runs without a
# dev server; `macos-private-api` is needed for the transparent window behind the sidebar.
tauri = { version = "2", features = ["custom-protocol", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"

[dev-dependencies]
insta = "1.49.0"
reqwest = "0.13.5"
