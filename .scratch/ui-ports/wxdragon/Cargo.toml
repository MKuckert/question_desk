[package]
name = "question-desk"
version = "0.1.0"
edition = "2024"
default-run = "question-desk"

[dependencies]
axum = "0.8"
directories = "6.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
pulldown-cmark = "0.13.6"
pulldown-cmark-to-cmark = "23.0.1"
rmcp = { version = "3.9", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tokio = { version = "1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
wxdragon = { version = "0.9.25", default-features = false, features = ["webview"] }

[features]
# Lets tools/screenshot.sh ask the app to render its own window to a PNG (macOS), for
# environments where window capture is not permitted. Off in normal builds.
snapshot = ["dep:block2", "dep:objc2-foundation"]

[target.'cfg(target_os = "macos")'.dependencies]
# The accent colour (wx has no system colour for controlAccentColor).
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
insta = "1.49.0"
reqwest = "0.13.5"

