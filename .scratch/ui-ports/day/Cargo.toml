[package]
name = "question-desk"
version = "0.1.0"
edition = "2024"
default-run = "question-desk"

[features]
# Let the app render its own window to a PNG on request (tools/screenshot.sh, when the
# sandbox denies `screencapture`). Off in normal builds.
snapshot = []

[dependencies]
directories = "6.0.0"
axum = "0.8"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
pulldown-cmark = "0.13.6"
pulldown-cmark-to-cmark = "23.0.1"
rmcp = { version = "3.9", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tokio = { version = "1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
day-core = "~0.7.10"
day-spec = "~0.7.10"

# Day (https://daybrite.dev): one backend per binary, chosen by target so a plain
# `cargo build` gives the native toolkit (AppKit / WinUI 3 / GTK 4).
[target.'cfg(target_os = "macos")'.dependencies]
day = { package = "day-app", version = "~0.7.10", features = ["appkit"] }
# Raw AppKit for the few things Day has no piece for (checkbox/radio NSButtons).
day-toolkit-appkit = "~0.7.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSButton", "NSButtonCell", "NSControl", "NSView", "NSResponder", "NSCell", "NSApplication", "NSMenu", "NSMenuItem", "NSWindow", "NSGraphics", "NSBitmapImageRep", "NSImageRep", "NSScrollView", "NSClipView", "NSText", "NSTextView", "NSTextField", "NSColor", "NSApplicationScripting", "NSEvent", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSArray", "NSDictionary", "NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
day = { package = "day-app", version = "~0.7.10", features = ["gtk"] }

[target.'cfg(windows)'.dependencies]
day = { package = "day-app", version = "~0.7.10", features = ["winui"] }

[dev-dependencies]
insta = "1.49.0"
reqwest = "0.13.5"
